        <section class="slide" data-slide="2" aria-label="Slide 2 of 14: The question" hidden><img src="./assets/media/slide-02-the-question.png" alt="A question asking whether we want a tool that thinks for us or makes us think." /></section>

        <section class="slide" data-slide="4" aria-label="Slide 4 of 14: Cognitive offloading" hidden><img src="./assets/media/slide-04-offloading-from-me-to-society.png" alt="Cognitive offloading shown as a ripple from an individual to society." /></section>
