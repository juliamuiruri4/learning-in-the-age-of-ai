name: Deploy deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the presentation
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html deck.js styles.css Hack-for-Humanity.pdf _site/
          cp assets/slide-1.png _site/assets/
          cp -R assets/media _site/assets/media
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
